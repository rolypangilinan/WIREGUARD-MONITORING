<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Main Menu - Tablet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #f0f4f8 0%, #e2e8f0 100%);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .header-bar {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1e3c72 100%);
            padding: 24px 0;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 16px 60px;
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: inline-block;
            letter-spacing: 2px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .content-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px 60px;
        }

        .menu-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .menu-label {
            font-size: 36px;
            font-weight: 800;
            color: #1e3a5f;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .menu-subtitle {
            font-size: 18px;
            color: #64748b;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .menu-divider {
            width: 100px;
            height: 5px;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border-radius: 3px;
            margin: 20px auto 0;
        }

        .menu-container {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 90%;
            max-width: 600px;
        }

        .menu-card {
            background: white;
            border-radius: 24px;
            padding: 36px 30px;
            text-decoration: none;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08), 0 2px 10px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 24px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .menu-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 6px;
            border-radius: 24px 0 0 24px;
        }

        .menu-card.card-blue::before {
            background: linear-gradient(180deg, #2563eb, #3b82f6);
        }

        .menu-card.card-purple::before {
            background: linear-gradient(180deg, #7c3aed, #a855f7);
        }

        .menu-card.card-teal::before {
            background: linear-gradient(180deg, #0d9488, #14b8a6);
        }

        .menu-card:active {
            transform: scale(0.97);
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .card-icon {
            width: 100px;
            height: 100px;
            min-width: 100px;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-blue .card-icon {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
        }

        .card-purple .card-icon {
            background: linear-gradient(135deg, #7c3aed, #a855f7);
            box-shadow: 0 8px 25px rgba(124, 58, 237, 0.35);
        }

        .card-teal .card-icon {
            background: linear-gradient(135deg, #0d9488, #14b8a6);
            box-shadow: 0 8px 25px rgba(13, 148, 136, 0.35);
        }

        .card-icon svg {
            width: 50px;
            height: 50px;
            fill: white;
        }

        .card-text {
            flex: 1;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 16px;
            color: #64748b;
            font-weight: 500;
            line-height: 1.5;
        }

        .card-arrow {
            width: 50px;
            height: 50px;
            min-width: 50px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-arrow svg {
            width: 24px;
            height: 24px;
            fill: #64748b;
        }

        .switch-view {
            margin-top: 40px;
            text-align: center;
        }

        .switch-view a {
            color: #64748b;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            padding: 12px 30px;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .switch-view a:active {
            background: #e2e8f0;
        }

        /* ===== PORTRAIT MODE ===== */
        body.portrait .menu-container {
            flex-direction: column;
        }
        body.portrait .menu-card {
            min-height: 100px;
        }
        body.portrait .card-title {
            font-size: 20px;
        }
        body.portrait .card-desc {
            font-size: 14px;
        }

        /* ===== LANDSCAPE MODE ===== */
        body.landscape .content-area {
            padding: 20px 40px;
        }
        body.landscape .menu-container {
            flex-direction: row;
            flex-wrap: wrap;
            gap: 16px;
        }
        body.landscape .menu-card {
            flex: 1 1 calc(50% - 16px);
            min-height: 80px;
        }
        body.landscape .card-title {
            font-size: 17px;
        }
        body.landscape .card-desc {
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <span class="header-title">Main Menu</span>
    </div>

    <div class="content-area">
        <div class="menu-section">
            <div class="menu-label">Select Module</div>
            <div class="menu-subtitle">Choose a module to get started</div>
            <div class="menu-divider"></div>
        </div>

        <div class="menu-container">
            <!-- Cycle Time Monitoring Card -->
            <a href="/cycle_time_home" class="menu-card card-blue">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/></svg>
                </div>
                <div class="card-text">
                    <div class="card-title">Cycle Time Monitoring</div>
                    <div class="card-desc">Track and analyze production cycle times in real-time</div>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                </div>
            </a>

            <!-- Manpower Details Card -->
            <a href="/manpower" class="menu-card card-purple">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                </div>
                <div class="card-text">
                    <div class="card-title">Manpower Details</div>
                    <div class="card-desc">Manage operator assignments and workforce information</div>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                </div>
            </a>

            <!-- Material Setter Card -->
            <div class="menu-card card-teal" onclick="window.location.href='/material_setter'">
                <div class="card-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 14h-2v-4H6v-2h4V7h2v4h4v2h-4v4z"/></svg>
                </div>
                <div class="card-text">
                    <div class="card-title">Material Setter</div>
                    <div class="card-desc">Configure materials and production settings</div>
                </div>
                <div class="card-arrow">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
                </div>
            </div>
        </div>

        <div class="switch-view">
            <a href="/">Switch to Desktop View</a>
        </div>
    </div>

<script>
    // Apply orientation class from URL param
    (function() {
        var params = new URLSearchParams(window.location.search);
        var orientation = params.get('orientation') || 'portrait';
        document.body.classList.add(orientation);
    })();
</script>
</body>
</html>
